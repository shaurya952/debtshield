name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datasets:
    name: Validate datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_datasets.py
      - name: Impact summary script smoke test
        run: python3 scripts/impact_summary.py docs/impact/sample_responses.example.csv

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scan_secrets.sh

  website:
    name: Website build + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build + test (default — forms not connected, CSP form-action 'self')
        working-directory: website
        run: node test.mjs
      - name: Build + test with a form endpoint (asserts CSP origin injection)
        working-directory: website
        env:
          FORM_ENDPOINT: https://example.formprovider.test/f/ci
        run: node test.mjs

  engine-tests:
    name: Engine unit tests (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version
      - name: Boot an available iPhone simulator and run engine tests
        run: |
          # Pick whatever iPhone simulator this runner actually has (by UDID, so we
          # never depend on a specific device name/OS existing on the image).
          xcrun simctl list devices available -j > /tmp/sims.json
          UDID=$(python3 -c "import json; d=json.load(open('/tmp/sims.json'))['devices']; ids=[x['udid'] for rt in d for x in d[rt] if x.get('isAvailable') and 'iPhone' in x.get('name','')]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then
            echo 'No iPhone simulator available on this runner:'; xcrun simctl list devices; exit 1
          fi
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcodebuild test \
            -project ios/DebtShieldAI.xcodeproj \
            -scheme DebtShieldAI \
            -destination "id=$UDID" \
            -only-testing:DebtShieldAITests

  # Gate: all core checks must pass before a merge.
  ci-ok:
    name: CI passed
    needs: [datasets, secret-scan, website, engine-tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."
